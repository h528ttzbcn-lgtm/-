[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-profit-calculator"
version = "0.1.0"
description = "Shopee listing profit/margin calculator from manually supplied cost & selling price"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
