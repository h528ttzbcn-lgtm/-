[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-bestseller-tracker"
version = "0.1.0"
description = "Tracks Amazon ASIN sales-rank/price via the official SP-API (+ optional Keepa API) and accumulates a Keepa-style history CSV over repeated runs"
requires-python = ">=3.10"
dependencies = [
    "python-amazon-sp-api>=1.9.16",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
keepa = ["keepa>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
