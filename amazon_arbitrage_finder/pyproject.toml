[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-arbitrage-finder"
version = "0.1.0"
description = "Finds products on Rakuten/Yahoo! Shopping (incl. electronics retailers) that can be resold profitably on Amazon"
requires-python = ">=3.10"
dependencies = [
    "python-amazon-sp-api>=1.9.16",
    "requests>=2.31",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
